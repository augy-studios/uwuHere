<!doctype html>
<html lang="en">

<head>
    <!-- Apply the saved theme before first paint. Same key as APP_KEY in js/theme.js. -->
    <script>
        (function () {
            var k = "uwuhere";
            var m = "light";
            var c = "classic";
            try {
                m = localStorage.getItem(k + ".mode") || "light";
                c = localStorage.getItem(k + ".colorTheme") || "classic";
            } catch (e) { }

            // Time based mode. Resolved here rather than in theme.js because
            // theme.js runs after first paint, and an evening reader would
            // otherwise watch a white page turn dark. Keep the two hours in step
            // with LIGHT_FROM_HOUR and LIGHT_UNTIL_HOUR in theme.js.
            document.documentElement.setAttribute("data-mode-preference", m);
            if (m === "time") {
                var h = new Date().getHours();
                m = h >= 9 && h < 18 ? "light" : "dark";
            }

            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
        })();
    </script>

    <!-- Paint a collapsed edge tray collapsed from the first frame, so a
         returning reader does not watch it slide shut. Same key as js/tray.js. -->
    <script>
        try {
            if (localStorage.getItem("uwuhere.trayOpen") === "0")
                document.documentElement.classList.add("tray-start-collapsed");
        } catch (e) { }
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FMCYFTFPEL"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());

        gtag('config', 'G-FMCYFTFPEL');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9715826188316382"
        crossorigin="anonymous"></script>

    <link rel="manifest" href="/manifest.json" />

    <meta charset="utf-8">
    <title>Check in | uwuHere | UwU Apps</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Take attendance in one tap. People check in when they're near the host.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="uwuHere | UwU Apps" />
    <meta property="og:site_name" content="UwU Apps" />
    <meta property="og:description" content="Take attendance in one tap. People check in when they're near the host." />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
    <meta name="theme-color" content="#ccffcc" />

    <!-- Embed Image -->
    <link rel="apple-touch-icon" href="/HAT-192.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image:src" content="/HAT-main.png">
    <meta property="og:image" content="/HAT-main.png" />
</head>

<body>
    <!-- Edge tray (edge-tray-spec.md, js/tray.js). -->
    <div class="hud-right">
        <div id="tray" class="tray">
            <button id="trayTab" class="tray-tab" type="button"
                aria-controls="trayButtons" aria-expanded="true" aria-label="Hide menu" title="Hide menu">
                <span data-icon="chevronRight"></span>
            </button>
            <div id="trayButtons" class="tray-buttons">
                <a class="glass-btn" href="/" aria-label="Home" title="Home"><span data-icon="home"></span></a>
                <span class="tray-rule" aria-hidden="true"></span>
                <button id="themeBtn" class="glass-btn" type="button" aria-haspopup="dialog"
                    aria-label="Theme" title="Theme"><span data-icon="sun"></span></button>
            </div>
        </div>
    </div>

    <main>
        <a class="brand" href="/">
            <img src="/HAT-192.png" alt="" width="30" height="30">
            <span>uwuHere</span>
        </a>

        <!-- No code in the link. -->
        <section class="glass card" id="codeView" hidden>
            <h1>Enter the event code</h1>
            <p class="card-lead">It is on the host's screen, under the QR code.</p>
            <form class="inline-form" id="codeForm" novalidate>
                <input class="code-input" id="codeInput" type="text" autocomplete="off" autocapitalize="characters"
                    spellcheck="false" maxlength="7" placeholder="CODE" aria-label="Event code">
                <button class="btn btn-primary" type="submit">Join</button>
            </form>
            <p class="banner error" id="codeError" hidden></p>
        </section>

        <!-- Not found, ended, not loadable offline. -->
        <section class="glass card" id="messageView" hidden>
            <h1 id="messageTitle"></h1>
            <p class="card-lead" id="messageText"></p>
            <a class="btn btn-block" href="/join" id="messageAction"><span data-icon="refresh"></span>Try another code</a>
        </section>

        <div class="stack" id="checkinView" hidden>
            <div class="join-head">
                <h1 id="eventTitle"></h1>
                <p id="eventCode"></p>
            </div>

            <section class="glass card" id="whoCard" aria-label="Your details">
                <label class="field">
                    <span class="field-head">Your name</span>
                    <input class="input" id="nameInput" type="text" maxlength="60" autocomplete="name" required>
                </label>
                <label class="field" id="noteField" hidden>
                    <span class="field-head" id="noteLabel"></span>
                    <input class="input" id="noteInput" type="text" maxlength="120" autocomplete="off">
                </label>
            </section>

            <p class="banner" id="doneCard" hidden></p>

            <div class="here-wrap">
                <button class="here-btn" id="hereBtn" type="button" aria-describedby="hereStatus">
                    <span data-icon="check" id="hereIcon" hidden></span>
                    <span id="hereLabel"></span>
                    <span class="here-sub" id="hereSub" hidden></span>
                </button>
            </div>
            <p class="here-status" id="hereStatus" role="status" aria-live="polite"></p>

            <button class="btn leave-btn" id="leaveBtn" type="button" aria-haspopup="dialog">
                <span data-icon="door"></span><span id="leaveText">I'm leaving early</span>
            </button>

            <p class="method-note" id="methodNote"></p>
        </div>
    </main>

    <!-- Leaving early -->
    <div class="modal-backdrop hidden" id="leaveModal">
        <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="leaveModalTitle">
            <div class="modal-head">
                <h2 id="leaveModalTitle">Leaving early?</h2>
                <button class="icon-btn small" type="button" data-close-modal="leaveModal" aria-label="Close">
                    <span data-icon="close"></span>
                </button>
            </div>
            <p class="modal-text">The host sees the time you left. This can only be done once.</p>
            <p class="banner error" id="leaveError" hidden></p>
            <div class="action-row">
                <button class="btn" type="button" data-close-modal="leaveModal">Stay</button>
                <button class="btn btn-primary" id="leaveConfirm" type="button"><span data-icon="door"></span>I'm leaving</button>
            </div>
        </div>
    </div>

    <!-- Theme -->
    <div class="modal-backdrop hidden" id="themeModal">
        <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle">
            <div class="modal-head">
                <h2 id="themeModalTitle">Theme</h2>
                <button class="icon-btn small" type="button" data-close-modal="themeModal" aria-label="Close">
                    <span data-icon="close"></span>
                </button>
            </div>
            <p class="modal-section-label">Mode</p>
            <div class="mode-toggle" id="modeToggle">
                <button class="mode-btn" type="button" data-mode="light" aria-pressed="false"><span data-icon="sun"></span>Light</button>
                <button class="mode-btn" type="button" data-mode="dark" aria-pressed="false"><span data-icon="moon"></span>Dark</button>
                <button class="mode-btn mode-btn-wide" type="button" data-mode="time" aria-pressed="false"><span data-icon="clock"></span>Time-based</button>
            </div>
            <p class="mode-note" id="modeNote" hidden></p>
            <p class="modal-section-label">Brand colour</p>
            <div class="swatch-grid" id="swatchGrid"></div>
        </div>
    </div>

    <script type="module" src="/js/join.js"></script>
</body>

</html>
